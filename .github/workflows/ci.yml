name: CI

on:
  push:
    branches: [main, "claude/**", "staging"]
  pull_request:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # Tests set their own values where needed; this is a harmless fallback.
          # 32+ chars so it satisfies the production-grade secret-length check.
          SESSION_SECRET: ci-test-session-secret-0123456789abcdef
