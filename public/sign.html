<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Contract — BusyDays</title>
  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #F4F0EA;
      --card: #FFFFFF;
      --text: #1C1917;
      --muted: #78716C;
      --line: #E8E2DA;
      --accent: #C26B45;
      --accent-hover: #A85A38;
      --danger: #9B1C1C;
      --success: #166534;
      --success-soft: #DCFCE7;
      --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; max-width: 640px; width: 100%; box-shadow: var(--shadow); }
    .contract-frame { width: 100%; height: 46vh; min-height: 280px; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 18px; }
    .sent-note { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
    .kicker { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.1; margin-bottom: 4px; }
    .biz { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .summary { background: var(--surface); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; border: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 15px; gap: 12px; }
    .row:not(:last-child) { border-bottom: 1px solid var(--line); }
    .row .label { color: var(--muted); flex-shrink: 0; }
    .row .value { font-weight: 600; text-align: right; }
    .price-row .value { font-size: 19px; color: var(--accent); }
    .view-link { display: block; text-align: center; font-size: 14.5px; color: var(--accent); margin-bottom: 22px; font-weight: 600; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input[type="text"] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 16px; }
    .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; color: var(--muted); margin-bottom: 20px; cursor: pointer; }
    .agree input { margin-top: 3px; }
    .sign-btn { display: block; width: 100%; padding: 16px 20px; text-align: center; cursor: pointer; border: none; border-radius: 8px; font: 600 17px/1 -apple-system, sans-serif; color: #fff; background: var(--accent); transition: background 0.15s; }
    .sign-btn:hover { background: var(--accent-hover); }
    .sign-btn:disabled { opacity: 0.6; cursor: default; }
    .status { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
    .status.error { color: var(--danger); }
    .signed-banner { background: var(--success-soft); border: 1px solid #A7E3BC; color: var(--success); border-radius: 12px; padding: 18px 20px; text-align: center; font-weight: 600; font-size: 15.5px; margin-bottom: 20px; line-height: 1.5; }
    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
    .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading" class="loading">Loading your contract…</div>
    <div id="content" style="display:none;">
      <div class="kicker">Booking Agreement</div>
      <h1 id="title">Your contract</h1>
      <div class="biz" id="biz"></div>

      <div class="summary">
        <div class="row"><span class="label">Client</span><span class="value" id="client"></span></div>
        <div class="row"><span class="label">Event</span><span class="value" id="event"></span></div>
        <div class="row"><span class="label">Date</span><span class="value" id="date"></span></div>
        <div class="row" id="venue-row"><span class="label">Venue</span><span class="value" id="venue"></span></div>
        <div class="row price-row"><span class="label">Booking value</span><span class="value" id="price"></span></div>
      </div>

      <iframe class="contract-frame" id="contract-frame" title="Your contract"></iframe>
      <div class="sent-note" id="sent-note" style="display:none;"></div>
      <a class="view-link" id="pdf-link" href="#" target="_blank" rel="noreferrer">📄 Open the contract in a new tab</a>

      <div id="signed-state" style="display:none;">
        <div class="signed-banner" id="signed-banner"></div>
      </div>

      <form id="sign-form" style="display:none;">
        <div class="field">
          <label for="signer">Type your full name to sign</label>
          <input type="text" id="signer" placeholder="Your full legal name" maxlength="120" autocomplete="name" required />
        </div>
        <label class="agree">
          <input type="checkbox" id="agree" required />
          <span>I have read the contract and I agree to its terms. Typing my name above is my digital signature.</span>
        </label>
        <button class="sign-btn" type="submit" id="sign-btn">Sign &amp; accept</button>
        <div class="status" id="status"></div>
      </form>
    </div>
    <div id="error" class="loading" style="display:none;color:var(--danger);"></div>
    <div class="footer">Powered by BusyDays · Secure signing link</div>
  </div>

  <script>
    const parts = window.location.pathname.split("/").filter(Boolean); // ["sign", wid, bid]
    const wid = decodeURIComponent(parts[1] || "");
    const bid = decodeURIComponent(parts[2] || "");
    const sig = new URLSearchParams(window.location.search).get("sig") || "";

    function fmtMoney(v) { return "₹" + Number(v || 0).toLocaleString("en-IN"); }
    function fmtDay(v) {
      if (!v) return "To be confirmed";
      const d = new Date(v);
      if (isNaN(d)) return v;
      return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    }

    function showSigned(name, at) {
      document.getElementById("sign-form").style.display = "none";
      document.getElementById("signed-state").style.display = "";
      const when = at ? new Date(at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "";
      document.getElementById("signed-banner").textContent =
        `✓ Signed by ${name}${when ? " on " + when : ""}. You're all set — see you at the event!`;
    }

    async function load() {
      try {
        const r = await fetch(`/api/public/contract/${encodeURIComponent(wid)}/${encodeURIComponent(bid)}?sig=${encodeURIComponent(sig)}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Contract not found");
        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "";
        document.getElementById("biz").textContent = data.businessName;
        document.getElementById("client").textContent = data.clientName;
        document.getElementById("event").textContent = data.eventType;
        document.getElementById("date").textContent = fmtDay(data.eventDate) + (data.eventTime ? " · " + data.eventTime : "");
        if (data.venue) document.getElementById("venue").textContent = data.venue;
        else document.getElementById("venue-row").style.display = "none";
        document.getElementById("price").textContent = fmtMoney(data.finalPrice);
        document.getElementById("pdf-link").href = data.pdfUrl;
        document.getElementById("contract-frame").src = data.pdfUrl;
        if (data.sentAt) {
          const sn = document.getElementById("sent-note");
          sn.style.display = "";
          sn.textContent = "Contract sent on " + new Date(data.sentAt).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
        }
        if (data.signed) showSigned(data.signerName, data.signedAt);
        else document.getElementById("sign-form").style.display = "";
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        const box = document.getElementById("error");
        box.style.display = "";
        box.textContent = err.message || "This link is invalid or has expired.";
      }
    }

    document.getElementById("sign-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signer").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("sign-btn");
      if (name.length < 2) { status.className = "status error"; status.textContent = "Please type your full name."; return; }
      btn.disabled = true;
      btn.textContent = "Signing…";
      status.className = "status";
      status.textContent = "";
      try {
        const r = await fetch(`/api/public/contract/${encodeURIComponent(wid)}/${encodeURIComponent(bid)}/sign`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sig, signerName: name }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Could not sign. Please try again.");
        showSigned(data.signerName || name, data.signedAt);
      } catch (err) {
        status.className = "status error";
        status.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Sign & accept";
      }
    });

    load();
  </script>
</body>
</html>
