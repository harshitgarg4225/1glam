<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusyDays</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #faf8f5;
        color: #2b2118;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 92vh;
        gap: 16px;
        text-align: center;
        padding: 24px;
        margin: 0;
      }
      h1 { font-size: 22px; margin: 0; }
      p { color: #6b5b4d; margin: 0; max-width: 320px; }
      button {
        background: #c26b45;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Offline fallback. The app normally loads the remote web app directly
         (capacitor.config.ts server.url); this page appears only when that
         fails — e.g. no network on first launch. -->
    <h1>Can't reach BusyDays</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </body>
</html>
